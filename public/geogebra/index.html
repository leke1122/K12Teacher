<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoGebra 3D Viewer</title>
  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; font-family: 'Segoe UI', sans-serif; }
    #ggb-container { width: 100%; height: 100%; position: relative; overflow: hidden; }
    #ggb-container > div { width: 100% !important; height: 100% !important; position: absolute !important; top: 0 !important; left: 0 !important; }
    #ggb-container canvas { width: 100% !important; height: 100% !important; display: block !important; }
    #ggb-container .applet_scaler { transform: none !important; width: 100% !important; height: 100% !important; }

    #ggb-loader {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; color: #6c757d; font-size: 16px; z-index: 10; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #ggb-loader.hidden { opacity: 0; pointer-events: none; }
    #ggb-loader .spinner {
      width: 40px; height: 40px; border: 4px solid #e9ecef; border-top-color: #007bff;
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px;
    }
    #ggb-loader .status { font-size: 13px; margin-top: 8px; color: #adb5bd; }
    #ggb-loader .detail { font-size: 12px; margin-top: 4px; color: #ced4da; }

    #ggb-error {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; color: #dc3545; font-size: 14px; display: none; padding: 20px;
      max-width: 400px;
    }
    #ggb-error.visible { display: block; }
    #ggb-error button {
      margin-top: 12px; padding: 6px 16px; background: #007bff; color: white;
      border: none; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    #ggb-error button:hover { background: #0056b3; }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="ggb-loader">
    <div class="spinner"></div>
    <div>加载 GeoGebra 3D...</div>
    <div class="status" id="loader-status">正在初始化...</div>
    <div class="detail" id="loader-detail">请稍候</div>
  </div>
  <div id="ggb-error">
    <div id="error-msg">GeoGebra 加载失败</div>
    <div id="error-detail" style="font-size:12px;color:#666;margin-top:6px;"></div>
    <button onclick="location.reload()">重新加载</button>
  </div>
  <div id="ggb-container"></div>

  <!-- 本地 GeoGebra 引擎（不依赖外部 CDN） -->
  <script src="/geogebra/deployggb.js"></script>

  <script>
    var ggbApplet = null;
    var appletApp = null;
    var appletReady = false;
    var initAttempts = 0;
    var injectAttempts = 0;

    var $status = document.getElementById('loader-status');
    var $detail = document.getElementById('loader-detail');
    var $loader = document.getElementById('ggb-loader');
    var $error = document.getElementById('ggb-error');
    var $errDetail = document.getElementById('error-detail');

    function setStatus(msg, detail) {
      if ($status) $status.textContent = msg;
      if ($detail && detail) $detail.textContent = detail;
    }

    function showError(msg) {
      if ($loader) $loader.classList.add('hidden');
      if ($error) $error.classList.add('visible');
      if ($errDetail) $errDetail.textContent = msg;
      console.error('[GeoGebra Loader]', msg);
    }

    function hideLoader() {
      if ($loader) $loader.classList.add('hidden');
    }

    function getContainerSize() {
      var c = document.getElementById('ggb-container');
      if (!c) return { w: 0, h: 0 };
      return { w: c.clientWidth, h: c.clientHeight };
    }

    function forceResize() {
      try {
        var size = getContainerSize();
        if (size.w <= 0 || size.h <= 0) return;
        var container = document.getElementById('ggb-container');
        if (!container) return;
        container.querySelectorAll('canvas').forEach(function(c) {
          c.style.width = '100%'; c.style.height = '100%';
        });
        var appletScaler = container.querySelector('.applet_scaler');
        if (appletScaler) {
          appletScaler.style.width = size.w + 'px';
          appletScaler.style.height = size.h + 'px';
          appletScaler.style.transform = '';
        }
        if (appletApp) {
          if (typeof appletApp.resize === 'function') appletApp.resize(size.w, size.h);
          if (typeof appletApp.repaintViews === 'function') appletApp.repaintViews();
        }
      } catch(e) { console.warn('[GeoGebra] forceResize:', e); }
    }

    function onAppletReady() {
      if (appletReady) return;
      appletReady = true;
      hideLoader();

      try {
        window.ggbApplet = ggbApplet;
        appletApp = ggbApplet.getAppletObject();
        if (appletApp) window.ggbApp = appletApp;
        ggbApplet.setErrorDialogsActive(false);
        GGBApplet.setErrorDialogsActive(false);
      } catch(e) { console.warn('[GeoGebra] onAppletReady:', e); }

      setStatus('引擎就绪', '正在渲染图形...');
      forceResize();
      setTimeout(function() { forceResize(); }, 2000);
      setTimeout(function() {
        try {
          ggbApplet.evalCommand('SetViewDirection(Vector((0,0,1)))');
          ggbApplet.evalCommand('ZoomIn()');
        } catch(e) {}
      }, 1500);

      // ResizeObserver 持续监听
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(function(entries) {
          for (var i = 0; i < entries.length; i++) {
            var e = entries[i];
            var w = e.contentRect.width, h = e.contentRect.height;
            if (w > 50 && h > 50) {
              forceResize();
              if (e.target._lastW > 0 && e.target._lastW < 100 && w > 200) location.reload();
              e.target._lastW = w; e.target._lastH = h;
            }
          }
        }).observe(document.getElementById('ggb-container') || document.body);
      }

      // 通知父窗口
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'geogebra_ready' }, '*');
        }
      } catch(e) {}
    }

    function pollForAppletReady() {
      if (appletReady) return;
      if (typeof ggbApplet !== 'undefined' && ggbApplet !== null) {
        try {
          if (typeof ggbApplet.getVersion === 'function') {
            onAppletReady();
            return;
          }
        } catch(e) {}
      }
      initAttempts++;
      setStatus('等待引擎就绪...', '(' + initAttempts + '/60)');
      if (initAttempts > 60) {
        showError('引擎加载超时（30秒），请检查网络或刷新重试');
        return;
      }
      setTimeout(pollForAppletReady, 500);
    }

    function injectApplet() {
      injectAttempts++;
      setStatus('注入画布...', '尝试 ' + injectAttempts + '/3');
      try {
        ggbApplet.inject('ggb-container');
        setTimeout(pollForAppletReady, 1000);
      } catch(e) {
        console.warn('[GeoGebra] inject error:', e);
        if (injectAttempts < 3) {
          setTimeout(injectApplet, 1000);
        } else {
          showError('画布注入失败: ' + (e.message || e));
        }
      }
    }

    function tryInit() {
      if (typeof GGBApplet === 'undefined') {
        showError('GeoGebra 引擎加载失败，请刷新重试');
        return;
      }

      var size = getContainerSize();
      setStatus('创建3D画布...', size.w + 'x' + size.h);

      // 等容器有尺寸（最多5秒）
      if ((size.w <= 0 || size.h <= 0) && initAttempts < 20) {
        initAttempts++;
        setTimeout(tryInit, 250);
        return;
      }

      var w = Math.max(size.w, 400);
      var h = Math.max(size.h, 300);

      try {
        ggbApplet = new GGBApplet(
          {
            appName: '3D',
            width: w,
            height: h,
            showToolBar: true,
            showAlgebraInput: false,
            showMenuBar: false,
            allowStyleBar: true,
            borderColor: '#ffffff',
            enableFileFeatures: false,
            showResetIcon: true,
            enable3D: true,
            preventFocus: false,
            appletOnLoad: onAppletReady,
            showAlgebraWindow: false,
            showSpreadsheetView: false,
            showCASView: false,
            showProbabilityView: false,
            showPlotPanel: false,
            showAuxiliaryObjects: false,
          },
          true,
          { is3D: true, AV: false, SV: false, CV: false, EV2: false, CP: false, PC: false }
        );

        // 关键：使用本地 web3d 引擎，不依赖外部 CDN
        ggbApplet.setHTML5Codebase('/geogebra/web3d/');

        injectApplet();

      } catch (e) {
        showError('创建 GGBApplet 失败: ' + (e.message || e));
      }
    }

    window.addEventListener('resize', function() {
      if (appletReady) forceResize();
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(tryInit, 300);
      });
    } else {
      setTimeout(tryInit, 300);
    }
  </script>
</body>
</html>
